# Zenyth Desktop(Tauri 셸) 빌드 · 배포.
#
# 2026-11-14 에 lowqen/Zenyth-web 의 desktop/ 과 desktop.yml 을 이 저장소로 옮겼다(이력은 git subtree split 으로
# 따라왔다). **화면은 웹과 한 벌이다** — 이 잡이 lowqen/Zenyth-web 을 web/ 에 받아 `pnpm build` 로 굽고,
# 셸(src-tauri)이 그 dist 를 싣는다(tauri.conf.json `frontendDist: ../web/dist`). 데스크톱 전용 화면 코드
# (src/app/desktop · 네이티브 엔진 다리 등)도 웹 저장소에 있다.
#
# 개발 기기에는 Rust · MSVC 를 깔지 않고 이 잡이 Windows 러너에서 셸을 빌드한다(2026-11-08 사용자 결정).
# 웹 번들의 **WASM 엔진은 싣지 않는다**(2026-11-09 결정) — 데스크톱의 엔진은 동봉한 네이티브 Rapfi(빌드 다섯 ·
# 엔진 선택창에서 고정 가능)와 원격 TCP 뿐이다.
#
# 산출물(아티팩트):
#   - Zenyth_<ver>_x64-setup.exe (+ .sig)   설치판(NSIS, 사용자 단위) · 자동 업데이트 서명
#   - Zenyth_<ver>_x64-portable.zip         포터블판(Zenyth.exe + engine/ + portable.txt)
#   - zenyth-desktop.exe · Cargo.lock       실기 스모크 · perf-shell 용, 잠금 파일 회수용
#
# 기본 엔진은 네이티브 Rapfi: 공식 릴리스(dhbloo/rapfi → dotb1ue/rapfi, 가중치 CC0)를 sha256 으로 고정해 받아
# engine/ 에 Windows 변형 5개 · 가중치 · config 를 싣고, 셸(engine.rs `BUILDS`)이 CPU 를 보고 고른다(«자동»).
# RenjuNet 파생 데이터 · rapfi.db 는 싣지 않는다(사용자 반입).
#
# 릴리스: `desktop-v<버전>` 태그를 올리면 «release» 잡이 GitHub 릴리스를 만들고, 자동 업데이트가 읽는
# 롤링 릴리스 `desktop-latest` 의 latest.json 을 바꾼다. 서명 개인키는 시크릿에만 있다(TAURI_SIGNING_PRIVATE_KEY*).
# 1.0.3 이하로 설치된 앱은 **lowqen/Zenyth-web** 의 desktop-latest 를 읽는다 — README «자동 업데이트 다리».
name: desktop

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "화면을 구울 lowqen/Zenyth-web 의 브랜치 · 태그 · 커밋"
        default: "main"
        type: string
  push:
    branches: [main]
    # 태그 푸시에는 paths 가 걸리지 않는다(GitHub 규칙) — 릴리스 태그는 언제나 돈다.
    tags: ["desktop-v*"]
  pull_request:
  # Zenyth-web 의 desktop-dispatch.yml 이 main 의 화면이 바뀔 때 보낸다(client_payload.web_ref = 그 커밋).
  # 빌드 · 시험 · 아티팩트까지만 — 릴리스 잡은 태그에서만 돈다.
  repository_dispatch:
    types: [web-main]

permissions:
  contents: read

concurrency:
  # 웹이 깨운 빌드끼리만 서로 밀어낸다 — 이 저장소의 main 푸시 빌드를 취소하지 않게.
  group: desktop-${{ github.event_name == 'repository_dispatch' && 'web' || github.ref }}
  cancel-in-progress: true

env:
  # 동봉 네이티브 엔진 — 공식 Rapfi 릴리스와 그 압축 파일의 sha256(GitHub 자산 digest).
  # 바꾸면 Zenyth-web 의 src/features/settings/AboutPanel.tsx RAPFI_NATIVE_TAG 도 같이(tests/tauri-config.test.ts 가 대조).
  RAPFI_NATIVE_TAG: "250615"
  RAPFI_NATIVE_SHA256: 1a3e24024062a153ac079060ee9589a37c6bdd1ecc54fed3908793c519594e05
  WEB_REF: ${{ github.event.client_payload.web_ref || inputs.web_ref || 'main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      web_sha: ${{ steps.web.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 화면 소스(lowqen/Zenyth-web)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lowqen/Zenyth-web
          ref: ${{ env.WEB_REF }}
          path: web

      - name: 화면 커밋
        id: web
        shell: bash
        run: echo "sha=$(git -C web rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 버전은 package.json 의 packageManager 필드에서 온다(이 저장소와 웹 모두 pnpm 9.12.3).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: 의존성(잠금 파일 그대로)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: 버전
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* && "${GITHUB_REF#refs/tags/desktop-v}" != "$v" ]]; then
            echo "::error::태그 ${GITHUB_REF#refs/tags/} 와 tauri.conf.json 버전 $v 가 다릅니다."
            exit 1
          fi

      # 셸 설정이 웹의 원본(헤더 · 기보 형식 · 엔진 빌드 id · 정보 화면)과 어긋나지 않는가.
      - name: 설정 대조
        shell: bash
        run: pnpm test

      - name: 화면 빌드
        shell: bash
        run: pnpm --dir web build

      # public/engine 의 WASM 글루 · .wasm 이 dist/ 로 복사돼 온다 — 데스크톱은 쓰지 않으므로 셸에 싣지 않는다.
      - name: WASM 엔진 빼기
        shell: bash
        run: |
          rm -rf web/dist/engine
          if find web/dist -name '*.wasm' | grep -q .; then echo "::error::dist 에 .wasm 이 남았습니다"; exit 1; fi

      # 소스맵은 셸 exe 에 싣지 않는다(배포와 같다 — 원본 TS 가 드러나지 않게, 크기도 준다).
      - name: 소스맵 빼기
        shell: bash
        run: find web/dist -name '*.map' -delete

      # tauri.conf.json `bundle.resources` 가 engine-bundle/* 를 설치 폴더의 engine/ 으로 싣는다.
      # tauri-build 가 빌드 때 이 파일들을 확인하므로 cargo test · tauri build 보다 먼저다.
      - name: 네이티브 엔진 동봉(공식 Rapfi)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/rapfi"; out=engine-bundle
          mkdir -p "$tmp" "$out"
          gh release download "$RAPFI_NATIVE_TAG" -R dhbloo/rapfi -p Rapfi-engine.7z -D "$tmp"
          echo "$RAPFI_NATIVE_SHA256  $tmp/Rapfi-engine.7z" | sha256sum -c -
          7z e -y -r -o"$out" "$tmp/Rapfi-engine.7z" 'pbrain-rapfi-windows-*.exe' '*.bin.lz4' 'model*.bin' config.toml AUTHORS > /dev/null
          # 셸이 고르는 변형(engine.rs variant_order) · config 가 읽는 가중치 · 모델이 모두 있는가.
          for f in pbrain-rapfi-windows-{avx512vnni,avx512,avxvnni,avx2,sse}.exe config.toml AUTHORS \
                   $(grep -oE '"[^"]+\.bin(\.lz4)?"' "$out/config.toml" | tr -d '"'); do
            [ -s "$out/$f" ] || { echo "::error::동봉 엔진에 $f 가 없습니다."; exit 1; }
          done
          cp LICENSE "$out/LICENSE.txt"
          cat > "$out/SOURCE.txt" <<EOF
          Rapfi — Gomoku/Renju engine, GPL-3.0-or-later (LICENSE.txt)
          Binaries and config: official release $RAPFI_NATIVE_TAG, unmodified
            https://github.com/dhbloo/rapfi/releases/tag/$RAPFI_NATIVE_TAG
          Corresponding source: https://github.com/dhbloo/rapfi/tree/$RAPFI_NATIVE_TAG
          Networks (*.bin.lz4): https://github.com/dhbloo/rapfi-networks (CC0-1.0)
          Authors: AUTHORS

          Zenyth Desktop picks the fastest build this CPU can run
          (avx512vnni > avx512 > avxvnni > avx2 > sse). rapfi.db is created here on first use.
          EOF
          ls -la "$out"

      # 러너에 rustup 이 깔려 있다 — 바깥 액션 없이 안정판만 맞춘다.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ runner.os }}-

      # 셸의 순수 논리(변형 고르기 등) — engine.rs 의 #[cfg(test)].
      - name: 셸 시험
        shell: bash
        working-directory: src-tauri
        run: cargo test --quiet

      # NSIS 도구(nsis · nsis_tauri_utils.dll)는 tauri 가 GitHub 릴리스에서 받는다 — 그 내려받기가 504 로
      # 연달아 떨어진 적이 있어(Z4) 받아 둔 것을 캐시하고, 번들 단계만 몇 번 다시 해 본다(컴파일은 증분이다).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: desktop-tauri-tools-${{ runner.os }}-v1

      # 서명 키가 없으면(포크 PR · 시크릿을 아직 넣지 않은 저장소) 업데이트 서명만 빼고 빌드한다 —
      # 셸이 컴파일되는지는 그래도 본다. 릴리스 잡은 서명(.sig)이 없으면 멈춘다.
      - name: 셸 빌드 (exe + NSIS + 업데이트 서명)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # target/ 은 cargo 캐시에서 돌아온다 — 옛 버전 설치판이 아티팩트에 섞이지 않게 번들만 비운다.
          rm -rf src-tauri/target/release/bundle
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 가 없습니다 — 업데이트 서명 없이 빌드합니다(릴리스 불가)."
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          for i in 1 2 3 4; do
            pnpm exec tauri build --ci "${extra[@]}" && exit 0
            echo "::warning::셸 빌드 실패($i/4) — 30초 뒤 다시"
            sleep 30
          done
          exit 1

      - name: 포터블 zip
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          root="$RUNNER_TEMP/portable"; p="$root/Zenyth"
          mkdir -p "$p/engine"
          cp src-tauri/target/release/zenyth-desktop.exe "$p/Zenyth.exe"
          cp engine-bundle/* "$p/engine/"
          cp LICENSE "$p/LICENSE.txt"
          cat > "$p/portable.txt" <<'EOF'
          Zenyth Desktop — portable build.

          This file marks the folder as portable: the app does not install updates by itself here
          (an update would install a second copy under %LOCALAPPDATA%). When a new version is out,
          download the new portable zip and replace this folder — keep engine/rapfi.db if you use the DB.
          Requires Microsoft Edge WebView2 (built into Windows 11).
          EOF
          (cd "$root" && 7z a -tzip -mx=7 "$GITHUB_WORKSPACE/Zenyth_${v}_x64-portable.zip" Zenyth > /dev/null)

      - name: 크기
        shell: bash
        run: |
          {
            echo "### zenyth-desktop ${{ steps.ver.outputs.version }} (화면 Zenyth-web@${{ steps.web.outputs.sha }})"
            echo '```'
            ls -la src-tauri/target/release/zenyth-desktop.exe src-tauri/target/release/bundle/nsis/ ./*.zip
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenyth-desktop-${{ github.sha }}
          path: |
            src-tauri/target/release/zenyth-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            ./*.zip
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  # 릴리스 — `desktop-v<버전>` 태그에서만. 설치판 · 서명 · 포터블을 올리고, 자동 업데이트가 읽는 latest.json 을
  # 롤링 릴리스 `desktop-latest` 에 덮어쓴다.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zenyth-desktop-${{ github.sha }}
          path: out

      - name: GitHub 릴리스 · latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.build.outputs.version }}
          WEB_SHA: ${{ needs.build.outputs.web_sha }}
        run: |
          set -euo pipefail
          tag="desktop-v$VER"
          setup=$(find out -name "Zenyth_${VER}_x64-setup.exe" | head -n1)
          sig="$setup.sig"; zip=$(find out -name "Zenyth_${VER}_x64-portable.zip" | head -n1)
          for f in "$setup" "$sig" "$zip"; do [ -s "$f" ] || { echo "::error::$f 가 없습니다(서명 키 시크릿 확인)"; exit 1; }; done

          cat > notes.md <<EOF
          Zenyth Desktop $VER — Windows 10/11 x64.

          - 설치판: \`Zenyth_${VER}_x64-setup.exe\` (사용자 단위 설치, 자동 업데이트)
          - 포터블: \`Zenyth_${VER}_x64-portable.zip\` (압축을 풀고 Zenyth.exe 실행)

          화면: [lowqen/Zenyth-web@${WEB_SHA:0:8}](https://github.com/lowqen/Zenyth-web/tree/$WEB_SHA).
          엔진: 공식 Rapfi $RAPFI_NATIVE_TAG 동봉 — CPU 에 맞는 변형을 자동 선택. 코드 서명이 없어 처음 실행 때
          SmartScreen 경고가 뜰 수 있습니다(추가 정보 → 실행).
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "Zenyth Desktop $VER" \
            --notes-file notes.md "$setup" "$sig" "$zip"

          url="https://github.com/$GH_REPO/releases/download/$tag/$(basename "$setup")"
          node -e '
            const fs = require("fs");
            const [ver, sigPath, url] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version: ver,
              notes: `Zenyth Desktop ${ver}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(sigPath, "utf8").trim(), url } },
            }, null, 2));
          ' "$VER" "$sig" "$url"
          cat latest.json

          gh release view desktop-latest > /dev/null 2>&1 || gh release create desktop-latest \
            --target "$GITHUB_SHA" --title "Zenyth Desktop — 업데이트 정보" --latest=false --prerelease \
            --notes "자동 업데이트가 읽는 latest.json 자리입니다. 설치 파일은 desktop-v* 릴리스에 있습니다."
          gh release upload desktop-latest latest.json --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-json
          path: latest.json
